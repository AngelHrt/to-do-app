<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <title>To Do App</title>
</head>

<body>

    <main class="content-container">

        <section class="todo-list-container">

            <header class="todo-header">
                <h1 class="title">Tareas</h1>
                <p>Enfoque y claridad para hoy.</p>
            </header>

            <div class="add-todo-container">
                <button id="add-button" aria-label="Agregar tarea">
                    <img src="add.svg" alt="">
                </button>

                <input
                    type="text"
                    id="new-todo"
                    placeholder="¿Qué hay que hacer?"
                >
            </div>

            <section class="tasks-section">
                <ul id="todo-list"></ul>
            </section>

            <section class="completed-section">
                <h2>COMPLETADAS</h2>
                <ul id="completed-list"></ul>
            </section>

            <footer class="progress-section">
                <div class="progress-header">
                    <div>
                        <span>PROGRESO</span>
                        <strong id="progress-text">0 de 0 tareas pendientes</strong>
                    </div>

                    <strong id="progress-percent">0%</strong>
                </div>

                <div class="progress-bar">
                    <div id="progress-fill"></div>
                </div>
            </footer>

        </section>

    </main>

</body>
</html>
